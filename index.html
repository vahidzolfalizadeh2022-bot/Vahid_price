<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعلام قیمت فروش</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>
body {
    font-family: Tahoma, sans-serif;
    direction: rtl;
    background: #f2f2f2;
    padding: 15px;
    margin: 0;
}

.card {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    max-width: 420px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

label, button {
    display: block;
    width: 100%;
    background: #007bff;
    color: white;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

input[type="file"] { display: none; }

input[type="text"] {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.item {
    background: #f8f8f8;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.code { font-size: 14px; color: #555; }
.title { font-size: 16px; margin: 5px 0; }
.price { font-size: 18px; font-weight: bold; color: #1a7f37; }

#scannerBox { display:none; margin-top:14px; }
#scannerVideo { width:100%; max-height:320px; background:#111; border-radius:10px; object-fit:contain; }
.scan-actions { display:flex; gap:8px; }
.scan-actions button { flex:1; }
#scanButton { background:#198754; }
#stopButton { background:#dc3545; }
#scanStatus { font-size:13px; color:#555; margin-top:8px; text-align:center; }
</style>
</head>

<body>

<div class="card">
    <h3 style="text-align:center">استعلام قیمت</h3>

    <label for="fileInput">آپدیت کردن قیمت‌ها (فایل)</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls">

    <button onclick="loadFromDrive()">لود از گوگل درایو</button>

    <input type="text" id="searchInput" placeholder="کد یا نام کالا" autocomplete="off" inputmode="search">
<div class="scan-actions"><button id="scanButton" type="button">📷 اسکن بارکد با دوربین</button><button id="stopButton" type="button" style="display:none">توقف اسکن</button></div>
<div id="scannerBox"><video id="scannerVideo" playsinline muted></video><div id="scanStatus">دوربین را روبه‌روی بارکد بگیرید.</div></div>

    <div id="results"></div><div style="font-size:12px;color:#777;text-align:center;margin-top:12px">برای استفاده از دوربین، صفحه باید از طریق HTTPS باز شود.</div>
</div>

<script>
let index = [];
let timer = null;

// 🔹 لینک CSV گوگل درایو (اینجا لینک خودت رو بگذار)
const DRIVE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTq0oTm-R9EfGYbQCZDxXihOMANruT0ygzhKTb9kV0Cgo0o3LeqGnsDs-nIPbagaw/pub?gid=0&single=true&output=csv";

function buildIndex(rows) {
    index = [];
    for (let i = 1; i < rows.length; i++) {
        if (!rows[i] || !rows[i][0]) continue;
        index.push({
            code: String(rows[i][0]),
            title: String(rows[i][1] || ""),
            price: rows[i][2],
            key: (rows[i][0] + " " + rows[i][1]).toLowerCase()
        });
    }
    document.getElementById("results").innerHTML =
        "<div class='item'>لیست قیمت آپدیت شد ✅</div>";
}

// 🔹 آپلود دستی اکسل
document.getElementById("fileInput").addEventListener("change", e => {
    const reader = new FileReader();
    reader.onload = e => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        buildIndex(XLSX.utils.sheet_to_json(sheet, { header: 1 }));
    };
    reader.readAsArrayBuffer(e.target.files[0]);
});

// 🔹 لود از گوگل درایو
function loadFromDrive() {
    fetch(DRIVE_CSV_URL)
        .then(res => res.text())
        .then(text => {
            const rows = text.split("\n").map(r => r.split(","));
            buildIndex(rows);
        })
        .catch(() => {
            alert("لود فایل از گوگل درایو انجام نشد");
        });
}


// جست‌وجو با اولویت تطبیق دقیق بارکد
function searchProducts(query) {
    const q = String(query || "").trim().toLowerCase();
    const results = document.getElementById("results");
    results.innerHTML = "";
    if (!q) return;

    const exact = index.filter(p => String(p.code).trim().toLowerCase() === q);
    const matches = exact.length ? exact : index.filter(p => p.key.includes(q)).slice(0, 50);

    if (!matches.length) {
        results.textContent = "کالایی با این بارکد یا عبارت پیدا نشد ❌";
        return;
    }

    matches.forEach(p => {
        const item = document.createElement("div");
        item.className = "item";
        const code = document.createElement("div");
        code.className = "code";
        code.textContent = "کد کالا: " + p.code;
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = p.title;
        const price = document.createElement("div");
        price.className = "price";
        const n = Number(String(p.price).replace(/[٬,\s]/g, ""));
        price.textContent = (Number.isFinite(n) ? n.toLocaleString("fa-IR") : p.price) + " ریال";
        item.append(code, title, price);
        results.appendChild(item);
    });
}

document.getElementById("searchInput").addEventListener("input", function () {
    clearTimeout(timer);
    const value = this.value;
    timer = setTimeout(() => searchProducts(value), 180);
});

// اسکن بارکد با دوربین پشت گوشی — تنظیم‌شده برای خواندن دقیق‌تر Code 128 / Full ASCII
let scannerControls = null;
let scanLocked = false;

function createScannerReader() {
    // در نسخه UMD ممکن است enumها در namespace اصلی یا namespace داخلی قرار گرفته باشند.
    const ZX = window.ZXingBrowser;
    const Hint = ZX.DecodeHintType || (ZX.ZXing && ZX.ZXing.DecodeHintType);
    const Format = ZX.BarcodeFormat || (ZX.ZXing && ZX.ZXing.BarcodeFormat);
    const hints = new Map();

    if (Hint && Format) {
        const formats = [
            "CODE_128", "CODE_39", "CODE_93",
            "EAN_13", "EAN_8", "UPC_A", "UPC_E",
            "ITF", "CODABAR", "QR_CODE", "DATA_MATRIX",
            "PDF_417", "AZTEC"
        ].map(name => Format[name]).filter(value => value !== undefined);

        if (formats.length) hints.set(Hint.POSSIBLE_FORMATS, formats);
        if (Hint.TRY_HARDER !== undefined) hints.set(Hint.TRY_HARDER, true);
        if (Hint.ALSO_INVERTED !== undefined) hints.set(Hint.ALSO_INVERTED, true);
        // Code 128 Full ASCII با FNC4 توسط decoder تفسیر می‌شود؛ خروجی را به عدد تبدیل نمی‌کنیم.
        if (Hint.CHARACTER_SET !== undefined) hints.set(Hint.CHARACTER_SET, "ISO-8859-1");
    }

    return new ZX.BrowserMultiFormatReader(hints);
}

async function startScanner() {
    const video = document.getElementById("scannerVideo");
    const box = document.getElementById("scannerBox");
    const startBtn = document.getElementById("scanButton");
    const stopBtn = document.getElementById("stopButton");
    const status = document.getElementById("scanStatus");

    box.style.display = "block";
    status.textContent = "در حال آماده‌سازی دوربین...";
    scanLocked = false;

    if (!window.ZXingBrowser || !ZXingBrowser.BrowserMultiFormatReader) {
        status.textContent = "کتابخانه اسکن بارکد بارگذاری نشد؛ اتصال اینترنت را بررسی کنید.";
        return;
    }

    startBtn.style.display = "none";
    stopBtn.style.display = "block";
    status.textContent = "در حال فعال‌سازی دوربین...";

    try {
        const reader = createScannerReader();
        scannerControls = await reader.decodeFromConstraints(
            {
                audio: false,
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    frameRate: { ideal: 30, max: 60 }
                }
            },
            video,
            (result, error) => {
                if (result && !scanLocked) {
                    scanLocked = true;
                    const code = result.getText(); // متن اصلی حفظ می‌شود؛ صفرهای ابتدا حذف نمی‌شوند.
                    const input = document.getElementById("searchInput");
                    input.value = code;
                    searchProducts(code);
                    status.textContent = "بارکد خوانده شد: " + code;
                    stopScanner(true);
                    input.focus();
                }
            }
        );

        // در صورت پشتیبانی گوشی، فوکوس پیوسته را فعال کن.
        const stream = video.srcObject;
        const track = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
        if (track && track.applyConstraints) {
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            const advanced = [];
            if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                advanced.push({ focusMode: "continuous" });
            }
            if (capabilities.zoom && capabilities.zoom.max > capabilities.zoom.min) {
                advanced.push({ zoom: Math.min(capabilities.zoom.max, Math.max(capabilities.zoom.min, 1.5)) });
            }
            if (advanced.length) {
                try { await track.applyConstraints({ advanced }); } catch (_) {}
            }
        }

        status.textContent = "دوربین فعال است؛ بارکد را صاف، نزدیک و داخل کادر نگه دارید.";
    } catch (e) {
        status.textContent = "دسترسی به دوربین ممکن نشد. اجازه Camera را بدهید و صفحه را با HTTPS باز کنید.";
        startBtn.style.display = "block";
        stopBtn.style.display = "none";
    }
}

function stopScanner(hidePreview = true) {
    scanLocked = true;
    if (scannerControls) {
        try { scannerControls.stop(); } catch (_) {}
        scannerControls = null;
    }
    const video = document.getElementById("scannerVideo");
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
    }
    document.getElementById("scanButton").style.display = "block";
    document.getElementById("stopButton").style.display = "none";
    if (hidePreview) document.getElementById("scannerBox").style.display = "none";
}

document.getElementById("scanButton").addEventListener("click", startScanner);
document.getElementById("stopButton").addEventListener("click", () => stopScanner(true));

</script>

</body>
</html>
